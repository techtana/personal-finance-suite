{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% import "_icons.html" as ic %}

{% block content %}
<div x-data="forecastPage()" class="space-y-6" x-cloak>

    <!-- Horizon -->
    <div class="flex flex-wrap items-center justify-between gap-3">
        <p class="text-xs text-gray-500">
            Starts from <a class="text-blue-600 hover:underline" href="/balances">today's recorded net worth</a>
            (<span x-text="fmt(startNw)"></span>) and adds every <a class="text-blue-600 hover:underline" href="/plan">rule and entry in your Plan</a> plus loan payments.
        </p>
        <div class="flex items-center gap-2">
            <label class="text-xs text-gray-500" for="fcRange">Look ahead</label>
            <select id="fcRange" x-model="range" @change="reload()" class="field" style="width:auto">
                <option value="1">1 year</option><option value="2">2 years</option><option value="3">3 years</option><option value="5">5 years</option><option value="10">10 years</option>
            </select>
        </div>
    </div>

    <div x-show="loading" class="space-y-6" aria-busy="true" aria-label="Computing forecast">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <template x-for="i in 4"><div class="card kpi"><div class="skeleton sk-line" style="width:45%"></div><div class="skeleton sk-value"></div></div></template>
    </div>
        <div class="grid grid-cols-1 xl:grid-cols-5 gap-4"><div class="xl:col-span-3"><div class="card p-5"><div class="skeleton sk-line mb-4" style="width:30%"></div><div class="skeleton" style="height:220px"></div></div></div><div class="xl:col-span-2 hidden xl:block"><div class="card p-5"><div class="skeleton sk-line mb-4" style="width:30%"></div><div class="skeleton" style="height:220px"></div></div></div></div>
    </div>
    <div x-show="error" class="card p-4 text-red-700 text-sm" x-text="error"></div>

    <template x-if="!loading && !error">
        <div class="space-y-6">

            <!-- Milestones -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
<div class="card view kpi">
    <div class="kpi-top"><p class="kpi-label">Today</p><span class="kpi-icon">{{ ic.icon("net-worth") }}</span></div>
    <p class="kpi-value" x-text="fmtWhole(startNw)"></p>
    <p class="kpi-sub">recorded net worth</p>
</div>
                <template x-for="m in milestones" :key="m.label">
<div class="card view kpi">
    <div class="kpi-top"><p class="kpi-label" x-text="m.label"></p><span class="kpi-icon">{{ ic.icon("forecast") }}</span></div>
    <p class="kpi-value" x-text="fmtWhole(m.value)"></p>
    <p class="kpi-sub"><span class="delta" :class="m.value - startNw >= 0 ? 'up' : 'down'" x-text="(m.value - startNw >= 0 ? '▲ ' : '▼ ') + fmtWhole(Math.abs(m.value - startNw))"></span> vs. today</p>
</div>
                </template>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 xl:grid-cols-5 gap-4">
                <div class="xl:col-span-3 card view p-5">
                    <div class="section-head">
                        <div><h3>Net worth</h3><p x-text="'Recorded up to today, forecast after' + (disabled.length ? '. Dashed line is your plan with nothing excluded.' : '.')"></p></div>
                        <span class="role-chip view">View only</span>
                    </div>
                    <div class="chart-box tall"><canvas id="nwChart" role="img" aria-label="Net worth: recorded history and forecast"></canvas></div>
                </div>
                <div class="xl:col-span-2 card view p-5">
                    <div class="section-head">
                        <div><h3>Cash flow by month</h3><p x-text="list.active() ? 'Only the events that match the filters below. Click a bar to see that month.' : 'Click a bar to see that month.'"></p></div>
                        <span class="role-chip view">View only</span>
                    </div>
                    <div class="chart-box tall"><canvas id="cfChart" role="img" aria-label="Planned income and expenses by month"></canvas></div>
                </div>
            </div>

            <!-- What-if -->
            <section class="card guidance p-5">
                <div class="section-head">
                    <div>
                        <h3>What if…</h3>
                        <p>Untick anything to see the forecast without it. Nothing in your Plan changes.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="role-chip guidance">Guidance</span>
                        <button type="button" class="btn btn-ghost btn-sm" x-show="disabled.length" @click="disabled = []; reload()">Reset</button>
                    </div>
                </div>
                <p class="text-sm mb-3" x-show="disabled.length && baselineEnd !== null">
                    Without the <span x-text="disabled.length"></span> unticked item<span x-show="disabled.length !== 1">s</span>, net worth at the end of
                    <span x-text="lastMonth"></span> is <strong x-text="fmt(endNw)"></strong>,
                    <strong :class="endNw - baselineEnd >= 0 ? 'text-green-700' : 'text-red-600'" x-text="fmtSigned(endNw - baselineEnd)"></strong> compared with your plan as it stands.
                </p>
                <div class="flex flex-wrap gap-x-5 gap-y-1.5 max-h-40 overflow-y-auto">
                    <template x-for="s in sources" :key="s.id">
                        <label class="flex items-center gap-2 text-sm cursor-pointer" :class="disabled.includes(s.id) ? 'text-gray-500 line-through' : 'text-gray-700'">
                            <input type="checkbox" class="rounded" :checked="!disabled.includes(s.id)" @change="toggleSource(s.id)">
                            <span x-text="s.label"></span>
                            <span class="text-xs" :class="s.total >= 0 ? 'text-green-700' : 'text-red-600'" x-text="fmtSigned(s.total)"></span>
                        </label>
                    </template>
                    <p class="text-sm text-gray-500" x-show="sources.length === 0">Nothing planned in this period yet. <a class="text-blue-600 hover:underline" href="/plan">Add rules in Plan</a>.</p>
                </div>
            </section>

            <!-- Events -->
            <section>
                {{ ui.section("Planned events", "view", "Every dated amount behind the charts. Edit them in Plan.") }}
                {{ ui.toolbar("list", "events", "shown", filters=[("month", "months"), ("type", "types"), ("source", "sources"), ("category", "categories")], date=true, amount=true, placeholder="Search events", noun="events") }}

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-3">
                    <!-- By month -->
                    <div class="card view overflow-hidden">
                        <div class="overflow-y-auto max-h-[300px] xl:max-h-[520px]">
                            <table class="data dense">
                                <thead><tr><th>Month</th><th class="num">In</th><th class="num">Out</th><th class="num">Net</th></tr></thead>
                                <tbody>
                                    <template x-for="m in byMonth" :key="m.month">
                                        <tr class="cursor-pointer" :class="list.f.month === m.month ? 'bg-blue-50' : ''" @click="pickMonth(m.month)" tabindex="0" @keydown.enter="pickMonth(m.month)">
                                            <td class="font-medium whitespace-nowrap" x-text="m.month"></td>
                                            <td class="num text-green-700" x-text="m.income ? fmt(m.income) : '—'"></td>
                                            <td class="num text-red-600" x-text="m.expenses ? fmt(m.expenses) : '—'"></td>
                                            <td class="num font-semibold" :class="m.net >= 0 ? 'text-green-700' : 'text-red-600'" x-text="fmtSigned(m.net)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- Events -->
                    <div class="xl:col-span-2 card view overflow-hidden">
                        <div class="xl:overflow-auto xl:max-h-[520px]">
                            <table class="data stack compact">
                                <thead><tr>
                                    {{ ui.th("list", "date", "Date") }}
                                    {{ ui.th("list", "label", "What") }}
                                    {{ ui.th("list", "amount", "Amount", num=true) }}
                                    {{ ui.th("list", "source", "From") }}
                                    {{ ui.th("list", "category", "Category") }}
                                    <th><span class="sr-only">Open in Plan</span></th>
                                </tr></thead>
                                <tbody>
                                    <template x-for="e in shown.slice(0, pageSize)" :key="e.key">
                                        <tr>
                                            <td class="whitespace-nowrap text-gray-500 cell-meta" data-label="Date" x-text="e.date"></td>
                                            <td class="font-medium text-gray-900 cell-title" x-text="e.label || '—'"></td>
                                            <td class="num cell-amount" data-label="Amount" :class="e.signed >= 0 ? 'text-green-700' : 'text-red-600'" x-text="fmtSigned(e.signed)"></td>
                                            <td class="cell-meta" data-label="From"><span class="badge" :class="e.source_type" x-text="e.source"></span></td>
                                            <td class="text-gray-500 cell-meta" data-label="Category" x-text="titleCase(e.category) || '—'"></td>
                                            <td class="num cell-actions"><a class="text-xs text-blue-600 hover:underline" :href="e.href" x-text="e.source_type === 'loan_payment' ? 'Balances →' : 'Plan →'"></a></td>
                                        </tr>
                                    </template>
                                    <tr x-show="shown.length === 0"><td colspan="6" class="text-center text-gray-500 py-8" x-text="events.length ? 'No events match these filters.' : 'Nothing planned in this period.'"></td></tr>
                                </tbody>
                                <tfoot x-show="shown.length">
                                    <tr><td colspan="2" class="px-4 py-2 text-xs text-gray-500" x-text="'Net of ' + shown.length + ' events shown'"></td>
                                        <td class="num px-4 py-2 font-semibold" :class="shownNet >= 0 ? 'text-green-700' : 'text-red-600'" x-text="fmtSigned(shownNet)"></td><td colspan="3"></td></tr>
                                </tfoot>
                            </table>
                        </div>
                        <div class="p-2 text-center" x-show="shown.length > pageSize"><button type="button" class="btn btn-ghost btn-sm" @click="pageSize += 100" x-text="'Show more (' + (shown.length - pageSize) + ' left)'"></button></div>
                    </div>
                </div>
            </section>
        </div>
    </template>
</div>

<script>
function forecastPage() {
    const SOURCE = { rule: 'recurring', change: 'one-off', rsu: 'RSU', espp: 'ESPP', loan_payment: 'loan payment' };
    let nwChart = null, cfChart = null;   // kept outside Alpine so Chart.js objects are not made reactive
    return {
        range: '1', loading: true, error: '', buckets: [], events: [], actuals: [], baseline: null, startNw: 0,
        disabled: [], list: null, pageSize: 100,

        get shown() { return this.list ? this.list.apply(this.events) : []; },
        get shownNet() { return this.shown.reduce((s, e) => s + e.signed, 0); },
        get byMonth() {
            const m = {};
            for (const b of this.buckets) m[b.month] = { month: b.month, income: 0, expenses: 0, net: 0 };
            for (const e of this.eventsIgnoringMonth()) {
                const row = m[e.month]; if (!row) continue;
                if (e.signed >= 0) row.income += e.signed; else row.expenses -= e.signed;
                row.net += e.signed;
            }
            return Object.values(m).sort((a, b) => a.month.localeCompare(b.month));
        },
        get endNw() { return this.buckets.length ? this.buckets[this.buckets.length - 1].cumulative_net_worth : this.startNw; },
        get baselineEnd() { return this.baseline && this.baseline.length ? this.baseline[this.baseline.length - 1].cumulative_net_worth : null; },
        get lastMonth() { return this.buckets.length ? this.buckets[this.buckets.length - 1].month : ''; },
        get milestones() {
            const out = [], n = this.buckets.length;
            const at = i => this.buckets[Math.min(n - 1, i)];
            if (!n) return out;
            const years = parseInt(this.range);
            const marks = years === 1 ? [[3, '+3 months'], [6, '+6 months'], [12, '+1 year']] : years <= 3 ? [[12, '+1 year'], [24, '+2 years'], [years * 12, '+' + years + ' years']].slice(0, years === 2 ? 2 : 3)
                : [[12, '+1 year'], [Math.round(years * 6), '+' + (years / 2) + ' years'], [years * 12, '+' + years + ' years']];
            for (const [i, label] of marks) out.push({ label, value: at(i).cumulative_net_worth });
            return out;
        },
        get sources() {
            const by = {};
            for (const e of this.allEvents || []) {
                const s = by[e.source_id] || (by[e.source_id] = { id: e.source_id, label: e.label.replace(/ (vest|purchase|payment)$/, ''), total: 0 });
                s.total += e.signed;
            }
            for (const id of this.disabled) if (!by[id]) by[id] = { id, label: this.disabledLabels[id] || 'Excluded item', total: 0 };
            return Object.values(by).sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
        },
        allEvents: [], disabledLabels: {},

        fmt(c) { return formatCurrency(c || 0); },
        eventsIgnoringMonth() { return this.list ? this.list.apply(this.events, 'month') : []; },
        pickMonth(month) { this.list.f.month = this.list.f.month === month ? '' : month; this.list.sync(); },
        toggleSource(id) {
            const s = this.sources.find(x => x.id === id);
            if (s) this.disabledLabels[id] = s.label;
            this.disabled = this.disabled.includes(id) ? this.disabled.filter(x => x !== id) : [...this.disabled, id];
            this.reload();
        },

        async init() {
            this.list = makeList({
                sort: 'date',
                search: e => [e.label, e.category, e.source].join(' '),
                filters: { month: e => e.month, type: e => e.type, source: e => e.source, category: e => e.category },
                date: e => e.date, amount: e => e.amount,
                sorts: { date: e => e.date, label: e => (e.label || '').toLowerCase(), amount: e => e.signed, source: e => e.source, category: e => e.category || '' },
            });
            this.list.read();
            const p = new URLSearchParams(location.search);
            if (p.get('range')) this.range = p.get('range');
            await this.reload();
            this.$watch(() => JSON.stringify([this.list.q, this.list.f, this.list.from, this.list.to, this.list.min, this.list.max]), () => this.drawCashFlow());
        },
        async reload() {
            this.error = '';
            try {
                const to = new Date(); to.setFullYear(to.getFullYear() + parseInt(this.range));
                const q = '/projection?from=' + todayISO() + '&to=' + to.toISOString().slice(0, 10) + '&history=12' + (this.disabled.length ? '&disable=' + this.disabled.join(',') : '');
                const d = await API.get(q);
                const shape = (e, i) => ({ ...e, key: e.source_id + e.date + i, month: e.date.slice(0, 7), signed: e.type === 'income' ? e.amount : -e.amount, source: SOURCE[e.source_type] || e.source_type,
                    href: e.source_type === 'loan_payment' ? '/balances?type=liability' : (e.source_type === 'change' ? '/plan?c_q=' + encodeURIComponent(e.label) : '/plan?edit=' + e.source_id) });
                this.buckets = d.buckets || []; this.events = (d.events || []).map(shape);
                this.actuals = d.actuals || []; this.baseline = d.baseline; this.startNw = d.starting_net_worth || 0;
                if (!this.disabled.length) this.allEvents = this.events;
                this.loading = false;
                await this.$nextTick(); this.drawNetWorth(); this.drawCashFlow();
            } catch (e) { this.error = 'The forecast could not be computed: ' + e.message; this.loading = false; }
        },

        drawNetWorth() {
            const canvas = document.getElementById('nwChart'); if (!canvas) return;
            if (nwChart) nwChart.destroy();
            const past = this.actuals.filter(a => a.month < todayISO().slice(0, 7) && !a.partial);
            const labels = [...past.map(a => a.month), ...this.buckets.map(b => b.month)];
            const datasets = [
                { label: 'Recorded', data: labels.map((m, i) => i < past.length ? past[i].net_worth / 100 : null), borderColor: CHART.series[0], backgroundColor: CHART.series[0], pointRadius: 3, pointBorderColor: CHART.surface, pointBorderWidth: 1.5 },
                { label: 'Forecast', data: labels.map((m, i) => i < past.length - 1 ? null : (i === past.length - 1 ? past[i].net_worth / 100 : this.buckets[i - past.length].cumulative_net_worth / 100)),
                  borderColor: CHART.series[0], backgroundColor: 'rgba(42, 120, 214, .10)', borderDash: [6, 4], fill: true },
            ];
            if (this.baseline) datasets.push({ label: 'Plan as it stands', data: labels.map((m, i) => i < past.length ? null : this.baseline[i - past.length].cumulative_net_worth / 100), borderColor: CHART.neutral, borderDash: [2, 3], borderWidth: 1.5 });
            nwChart = new Chart(canvas.getContext('2d'), {
                type: 'line', data: { labels, datasets },
                options: { spanGaps: false, plugins: { tooltip: { callbacks: { label: chartTooltipMoney } } },
                    scales: { y: { ticks: { callback: chartMoneyTick } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } } } },
            });
        },
        drawCashFlow() {
            const canvas = document.getElementById('cfChart'); if (!canvas) return;
            if (cfChart) cfChart.destroy();
            const rows = this.byMonth, self = this;
            cfChart = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: { labels: rows.map(r => r.month), datasets: [
                    { label: 'Income', data: rows.map(r => r.income / 100), backgroundColor: CHART.series[0] },
                    { label: 'Expenses', data: rows.map(r => r.expenses / 100), backgroundColor: CHART.series[1] } ] },
                options: {
                    onClick(evt, els) { if (els.length) self.pickMonth(rows[els[0].index].month); },
                    onHover(evt, els) { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
                    plugins: { tooltip: { callbacks: { label: chartTooltipMoney } } },
                    scales: { y: { ticks: { callback: chartMoneyTick } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } } } },
            });
        },
    };
}
</script>
{% endblock %}
