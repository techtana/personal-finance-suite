{% extends "base.html" %}

{% block title %}Settings - Personal Finance Suite{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<div x-data="settingsPage()" x-init="init()" class="max-w-4xl space-y-6">

    <div x-show="loading" class="text-center py-12 text-gray-500">Loading...</div>

    <!-- Tabs -->
    <div x-show="!loading" class="border-b border-gray-200">
        <nav class="flex space-x-8">
            <button @click="tab='general'" :class="tab==='general' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-1 py-4 font-medium text-sm">General</button>
            <button @click="tab='categories'" :class="tab==='categories' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-1 py-4 font-medium text-sm">Categories</button>
            <button @click="tab='backups'; loadBackups()" :class="tab==='backups' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-1 py-4 font-medium text-sm">Backups</button>
            <button @click="tab='data'" :class="tab==='data' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-1 py-4 font-medium text-sm">Data</button>
        </nav>
    </div>

    <!-- General Settings -->
    <template x-if="!loading && tab==='general'">
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-6">General Settings</h3>
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Currency</label>
                        <select x-model="settings.currency" class="w-full px-4 py-2 border rounded-lg bg-white text-sm">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="THB">THB (฿)</option>
                            <option value="JPY">JPY (¥)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Locale</label>
                        <select x-model="settings.locale" class="w-full px-4 py-2 border rounded-lg bg-white text-sm">
                            <option value="en-US">en-US</option>
                            <option value="en-GB">en-GB</option>
                            <option value="de-DE">de-DE</option>
                            <option value="th-TH">th-TH</option>
                            <option value="ja-JP">ja-JP</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Fiscal Year Start Month</label>
                        <select x-model.number="settings.fiscal_year_start_month" class="w-full px-4 py-2 border rounded-lg bg-white text-sm">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="7">July</option>
                            <option value="10">October</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Default Withholding Rate (%)</label>
                        <div class="flex items-center">
                            <input x-model.number="withholdingPct" type="number" min="0" max="100" step="0.1" class="w-full px-4 py-2 border rounded-lg text-sm">
                            <span class="ml-2 text-gray-500">%</span>
                        </div>
                    </div>
                </div>
                <button @click="saveSettings()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">Save Changes</button>
            </div>
        </div>
    </template>

    <!-- Categories -->
    <template x-if="!loading && tab==='categories'">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-gray-900">Categories</h3>
                <button @click="openAddCat()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">+ Add Category</button>
            </div>

            <template x-if="categories.length === 0">
                <div class="text-center text-gray-400 py-8">No categories yet.</div>
            </template>

            <table x-show="categories.length > 0" class="w-full text-sm">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-4 py-2 text-left font-medium text-gray-600">Slug</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-600">Label</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-600">Type</th>
                        <th class="px-4 py-2 text-left font-medium text-gray-600">Color</th>
                        <th class="px-4 py-2"></th>
                    </tr>
                </thead>
                <tbody class="divide-y">
                    <template x-for="c in categories" :key="c.slug">
                        <tr>
                            <td class="px-4 py-3 text-gray-500 font-mono text-xs" x-text="c.slug"></td>
                            <td class="px-4 py-3 font-medium" x-text="c.label"></td>
                            <td class="px-4 py-3">
                                <span :class="c.type === 'income' ? 'bg-green-100 text-green-800' : c.type === 'expense' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'" class="px-2 py-0.5 rounded text-xs font-medium capitalize" x-text="c.type"></span>
                            </td>
                            <td class="px-4 py-3">
                                <div class="w-6 h-6 rounded border" :style="'background:' + c.color"></div>
                            </td>
                            <td class="px-4 py-3 text-right whitespace-nowrap">
                                <button @click="openEditCat(c)" class="text-blue-600 hover:underline mr-3">Edit</button>
                                <button @click="deleteCat(c.slug)" class="text-red-600 hover:underline">Delete</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>

    <!-- Backups / restore points -->
    <template x-if="!loading && tab==='backups'">
        <div class="space-y-4">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-1">Google Cloud backups</h3>
                <p class="text-sm text-gray-500 mb-5">
                    Each backup is a full copy of your data saved to a Google Cloud Storage bucket.
                    Sign in once on this computer with <code class="text-xs bg-gray-100 px-1 rounded">gcloud auth application-default login</code>,
                    and keep the bucket private.
                </p>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Google Cloud project</label>
                        <input x-model="backupCfg.project" type="text" placeholder="my-project-id" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bucket</label>
                        <input x-model="backupCfg.bucket" type="text" placeholder="my-finance-backups" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Folder in bucket</label>
                        <input x-model="backupCfg.prefix" type="text" placeholder="finance-backups/" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Regular backup</label>
                            <select x-model="backupCfg.frequency" class="w-full px-3 py-2 border rounded-lg bg-white text-sm">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="off">Off</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Keep last</label>
                            <input x-model.number="backupCfg.keep" type="number" min="1" max="365" class="w-full px-3 py-2 border rounded-lg text-sm">
                        </div>
                    </div>
                </div>
                <p class="text-xs text-gray-400 mt-2">Only scheduled backups are pruned. Backups made before clearing, restoring, or importing are kept until you delete them.</p>
                <div class="mt-5 flex items-center gap-3">
                    <button @click="saveBackupCfg()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Save</button>
                    <button @click="backupNow()" :disabled="!!busy || !backups.configured" class="px-4 py-2 text-sm border rounded-lg hover:bg-gray-50 disabled:opacity-50">Back up now</button>
                    <span x-show="busy" class="text-sm text-gray-500" x-text="busy"></span>
                </div>
                <div x-show="backups.status && backups.status.last_scheduled_error" class="mt-4 p-3 rounded bg-yellow-50 border border-yellow-200 text-sm text-yellow-800">
                    Last scheduled backup failed: <span x-text="backups.status && backups.status.last_scheduled_error"></span>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex justify-between items-baseline mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Restore points</h3>
                    <span class="text-xs text-gray-400 font-mono" x-text="backups.target || ''"></span>
                </div>
                <div x-show="!backups.configured" class="text-sm text-gray-500 py-4">Set a bucket above to start backing up.</div>
                <div x-show="backups.error" class="p-3 rounded bg-red-50 border border-red-200 text-sm text-red-800" x-text="backups.error"></div>
                <div x-show="backups.configured && !backups.error && backups.backups.length === 0" class="text-sm text-gray-400 py-4">No backups yet.</div>
                <table x-show="backups.backups.length > 0" class="w-full text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-4 py-2 text-left font-medium text-gray-600">Created</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-600">Reason</th>
                            <th class="px-4 py-2 text-left font-medium text-gray-600">File</th>
                            <th class="px-4 py-2 text-right font-medium text-gray-600">Size</th>
                            <th class="px-4 py-2"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <template x-for="b in backups.backups" :key="b.name">
                            <tr>
                                <td class="px-4 py-3 whitespace-nowrap" x-text="new Date(b.created_at).toLocaleString()"></td>
                                <td class="px-4 py-3" x-text="b.kind_label"></td>
                                <td class="px-4 py-3 font-mono text-xs text-gray-500" x-text="b.name"></td>
                                <td class="px-4 py-3 text-right text-gray-500" x-text="Math.max(1, Math.round(b.size / 1024)) + ' KB'"></td>
                                <td class="px-4 py-3 text-right whitespace-nowrap">
                                    <button @click="restore(b)" :disabled="!!busy" class="text-blue-600 hover:underline mr-3 disabled:opacity-50">Restore</button>
                                    <button @click="deleteBackup(b)" :disabled="!!busy" class="text-red-600 hover:underline disabled:opacity-50">Delete</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- Data Management -->
    <template x-if="!loading && tab==='data'">
        <div class="space-y-4">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-6">Data Management</h3>
                <div class="space-y-4">

                    <div class="p-4 border rounded-lg">
                        <h4 class="font-semibold text-gray-900 mb-2">Export Data</h4>
                        <p class="text-sm text-gray-500 mb-3">Download all your financial data as JSON</p>
                        <a href="/api/export" class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 inline-block">Export as JSON</a>
                    </div>

                    <div class="p-4 border rounded-lg">
                        <h4 class="font-semibold text-gray-900 mb-2">Import Data</h4>
                        <p class="text-sm text-gray-500 mb-3">Restore from a previously exported JSON file</p>
                        <label class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 cursor-pointer inline-block">
                            Import JSON
                            <input type="file" accept=".json" class="hidden" @change="importData($event)">
                        </label>
                    </div>

                    <div class="p-4 border rounded-lg bg-red-50 border-red-200">
                        <h4 class="font-semibold text-red-900 mb-2">Danger Zone: Clear All Data</h4>
                        <p class="text-sm text-red-700 mb-3">
                            Deletes every account, loan, asset, rule, transaction, snapshot, and category. A backup is saved to
                            Google Cloud first; if that backup fails, nothing is deleted. Your settings are kept.
                        </p>
                        <button @click="clearAll()" :disabled="!!busy" class="px-4 py-2 text-sm bg-red-600 text-white rounded hover:bg-red-700 disabled:opacity-50">Clear All Data</button>
                        <span x-show="busy" class="ml-3 text-sm text-red-700" x-text="busy"></span>
                    </div>

                </div>
            </div>
        </div>
    </template>

    <!-- Category Modal -->
    <div x-show="showCatModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50" @click.self="showCatModal = false">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4" x-text="editingCatSlug ? 'Edit Category' : 'Add Category'"></h3>
            <div class="space-y-3">
                <div x-show="!editingCatSlug">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Slug (unique ID)</label>
                    <input x-model="catForm.slug" type="text" placeholder="e.g. groceries" class="w-full px-3 py-2 border rounded-lg text-sm" :disabled="!!editingCatSlug">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Label</label>
                    <input x-model="catForm.label" type="text" placeholder="e.g. Groceries" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <select x-model="catForm.type" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                        <option value="both">Both</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                    <input x-model="catForm.color" type="color" class="w-full h-9 border rounded-lg cursor-pointer">
                </div>
            </div>
            <div class="mt-6 flex space-x-3 justify-end">
                <button @click="showCatModal = false" class="px-4 py-2 text-gray-600 hover:text-gray-900">Cancel</button>
                <button @click="saveCat()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">Save</button>
            </div>
        </div>
    </div>

</div>

<script>
function settingsPage() {
    return {
        settings: {},
        categories: [],
        loading: true,
        tab: 'general',
        showCatModal: false,
        editingCatSlug: null,
        catForm: {},
        withholdingPct: 22,
        backups: { configured: false, backups: [], error: null, status: {} },
        backupCfg: {},
        busy: '',

        async init() {
            try {
                const [s, cats] = await Promise.all([API.get('/settings'), API.get('/categories')]);
                this.settings = s;
                this.categories = cats;
                this.withholdingPct = (s.default_withholding_rate / 100).toFixed(1);
            } catch (e) {
                showAlert('Failed to load: ' + e.message, 'error');
            } finally {
                this.loading = false;
            }
        },

        async saveSettings() {
            try {
                await API.patch('/settings', {
                    currency: this.settings.currency,
                    locale: this.settings.locale,
                    fiscal_year_start_month: parseInt(this.settings.fiscal_year_start_month),
                    default_withholding_rate: Math.round(parseFloat(this.withholdingPct) * 100),
                });
                showAlert('Settings saved', 'success');
            } catch (e) {
                showAlert('Error: ' + e.message, 'error');
            }
        },

        openAddCat() {
            this.editingCatSlug = null;
            this.catForm = { slug: '', label: '', type: 'expense', color: '#6b7280' };
            this.showCatModal = true;
        },
        openEditCat(c) {
            this.editingCatSlug = c.slug;
            this.catForm = { slug: c.slug, label: c.label, type: c.type, color: c.color };
            this.showCatModal = true;
        },

        async saveCat() {
            try {
                if (this.editingCatSlug) {
                    await API.patch('/categories/' + this.editingCatSlug, { label: this.catForm.label, type: this.catForm.type, color: this.catForm.color });
                } else {
                    await API.post('/categories', this.catForm);
                }
                showAlert('Category saved', 'success');
                this.showCatModal = false;
                this.categories = await API.get('/categories');
            } catch (e) {
                showAlert('Error: ' + e.message, 'error');
            }
        },

        async deleteCat(slug) {
            if (!confirm('Delete category "' + slug + '"?')) return;
            try {
                await API.delete('/categories/' + slug);
                showAlert('Deleted', 'success');
                this.categories = await API.get('/categories');
            } catch (e) {
                showAlert('Error: ' + e.message, 'error');
            }
        },

        async importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                await API.post('/import', data);
                showAlert('Import successful', 'success');
                await this.init();
            } catch (e) {
                showAlert('Import failed: ' + e.message, 'error');
            }
        },

        async loadBackups() {
            try {
                this.backups = await API.get('/backups');
                this.backupCfg = { ...this.backups.config };
            } catch (e) {
                showAlert('Failed to load backups: ' + e.message, 'error');
            }
        },

        async saveBackupCfg() {
            try {
                await API.patch('/backups/config', this.backupCfg);
                showAlert('Backup settings saved', 'success');
                await this.loadBackups();
            } catch (e) {
                showAlert('Error: ' + e.message, 'error');
            }
        },

        async backupNow() {
            this.busy = 'Backing up to Google Cloud…';
            try {
                const b = await API.post('/backups', {});
                showAlert('Saved ' + b.name, 'success');
                await this.loadBackups();
            } catch (e) {
                showAlert('Backup failed: ' + e.message, 'error');
            } finally {
                this.busy = '';
            }
        },

        async restore(b) {
            const when = new Date(b.created_at).toLocaleString();
            if (!confirm('Replace all current data with the restore point from ' + when + '?\n\nYour current data is backed up first, so you can undo this by restoring that backup.')) return;
            this.busy = 'Restoring…';
            try {
                await API.post('/backups/' + encodeURIComponent(b.name) + '/restore', {});
                showAlert('Restored data from ' + when, 'success');
                await this.init();
                await this.loadBackups();
            } catch (e) {
                showAlert('Restore failed: ' + e.message, 'error');
            } finally {
                this.busy = '';
            }
        },

        async deleteBackup(b) {
            if (!confirm('Permanently delete ' + b.name + ' from Google Cloud? This cannot be undone.')) return;
            try {
                await API.delete('/backups/' + encodeURIComponent(b.name));
                showAlert('Deleted ' + b.name, 'success');
                await this.loadBackups();
            } catch (e) {
                showAlert('Error: ' + e.message, 'error');
            }
        },

        async clearAll() {
            if (prompt('This deletes ALL your financial data after saving a backup to Google Cloud.\n\nType DELETE to continue.') !== 'DELETE') return;
            this.busy = 'Backing up, then clearing…';
            try {
                const r = await API.post('/data/clear', {});
                showAlert('All data cleared. Backup saved as ' + r.backup.name, 'success');
                await this.init();
            } catch (e) {
                showAlert(e.message, 'error');
            } finally {
                this.busy = '';
            }
        },

    };
}
</script>
{% endblock %}
