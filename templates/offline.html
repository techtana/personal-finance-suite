<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Can't reach your finance app</title>
    <link rel="icon" href="{{ asset('icons/favicon.svg') }}" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
               padding-top: max(24px, env(safe-area-inset-top)); background: #f6f7fb; color: #0f172a;
               font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        main { max-width: 420px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(15, 23, 42, .18); }
        h1 { font-size: 20px; margin: 20px 0 8px; }
        p { color: #475569; margin: 0 0 12px; }
        ul { text-align: left; color: #475569; padding-left: 20px; margin: 16px 0 24px; }
        li { margin-bottom: 6px; }
        button { font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 10px;
                 padding: 12px 22px; min-height: 48px; cursor: pointer; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <img src="{{ asset('icons/icon-192.png') }}" alt="" width="72" height="72">
    <h1>Can't reach your finance app</h1>
    <p>Your data stays on the computer that runs the app, so this device has to reach it.</p>
    <ul>
        <li>Check that the app is running on that computer.</li>
        <li>Check that this device is connected to the same network or VPN as before.</li>
    </ul>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
